#############################################################################
# Test values for epik8s-chart
# Demonstrates BOTH deployment modes:
#   Mode 1: Backend infrastructure + beamline provisioning
#   Mode 2: The beamline root apps will deploy IOCs/services/apps
#############################################################################

#############################################################################
# Mode 2 defaults (used when beamline root apps invoke epik8s-chart)
#############################################################################
beamline: test
namespace: test
epik8namespace: "k8sda.lnf.infn.it"
ingressClassName: "nginx"
targetRevision: "main"
serviceAccountName: "default"
openshift: false

argocdRbac:
  enabled: true

epicsConfiguration:
  name: "epics-configuration"
  address_list: ""
  max_array_bytes: "10000000"
  staticIp: true
  services:
  applications:
  iocs:
  externalIoc:

usegateway: true

cronjobs:
  charturl: 'https://baltig.infn.it/epics-containers/generic-application-chart.git'

syncPolicy:
  automated:
    prune: true
    selfHeal: true
  syncOptions:
    - CreateNamespace=true
    - Prune=true

#############################################################################
# Mode 1: Backend Infrastructure
# Shared services for all beamlines (one per cluster)
#############################################################################
backend:
  install: true
  namespace: "backend"
  domain: "k8sda.lnf.infn.it"

  secrets:
    enabled: false

  # MongoDB
  mongodb:
    enabled: true
    replicas: 1
    storage: "10Gi"
    storageClass: ""
    auth:
      enabled: false
    resources:
      limits:
        cpu: "2"
        memory: "2Gi"
      requests:
        cpu: "500m"
        memory: "512Mi"

  # Elasticsearch
  elasticsearch:
    enabled: true
    replicas: 1
    chartVersion: "8.5.1"
    storage: "10Gi"
    ingress:
      enabled: false
    resources:
      limits:
        cpu: "4"
        memory: "4Gi"
      requests:
        cpu: "1"
        memory: "2Gi"

  # Kafka (Strimzi)
  kafka:
    enabled: true
    clusterName: "epics-kafka"
    version: "4.1.0"
    replicas: 3
    storage:
      type: "ephemeral"
      size: "10Gi"
      deleteClaim: false
      storageClass: ""
    strimzi:
      operatorVersion: "0.48.0"
      resources:
        limits:
          cpu: "1000m"
          memory: "768Mi"
        requests:
          cpu: "200m"
          memory: "512Mi"
      livenessProbe:
        timeoutSeconds: 10
    resources:
      limits:
        cpu: "2"
        memory: "4Gi"
      requests:
        cpu: "1"
        memory: "2Gi"

  argocd:
    install: false
  metallb:
    enabled: false
  nfsStorageClass:
    enabled: false
  multus:
    enabled: false

  # Backend connection info (used by Mode 2 beamline deployments)
  mongo:
    host: mongodb
    port: 27017
    user: ""
    pwd: ""
  elasticsearch:
    host: elasticsearch
    clusterName: elasticsearch
    port: 9200
  kafka:
    host: kafka-controller-headless
    port: 9092

#############################################################################
# Mode 1: Beamline Provisioning
# Each beamline gets: namespace, ArgoCD project, user, git credentials,
# and a root app that deploys the beamline's IOCs/services/apps (Mode 2)
#############################################################################
beamlines:
  # RKE2 Test Beamline (public repo, no PAT needed)
  - name: "rke2-test"
    namespace: "rke2-test"
    # Root app: ArgoCD will deploy this beamline's chart as app-of-apps
    repoURL: "https://github.com/infn-epics/epik8s-rke2-test.git"
    targetRevision: "main"
    path: "deploy"

  # ELI Cloud Beamline (private repo, PAT required)
  - name: "eli-cloud"
    namespace: "eli-cloud"
    # Git credentials for ArgoCD to access private repository
    gitPAT: "glpat-xxxxxxxxxxxxx"        # Replace with actual PAT
    gitURL: "https://baltig.infn.it"
    gitUsername: "git"
    # Root app: ArgoCD will deploy this beamline's chart as app-of-apps
    repoURL: "https://baltig.infn.it/epics-containers/epik8s-eli-cloud-beamline.git"
    targetRevision: "main"
    path: "deploy"
